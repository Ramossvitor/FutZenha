name: Verificação

# Workflow reutilizável: a única fonte de verdade do que "verde" significa.
# Chamado pelo ci.yml (todo PR e push na main) e pelo deploy.yml (gate do botão
# de publicar) — o que protege um PR é exatamente o que protege um deploy.
on:
  workflow_call:
    inputs:
      ref:
        description: "Ref a verificar. Vazio = a ref do evento que disparou."
        required: false
        type: string
        default: ""
    outputs:
      sha:
        description: "O commit exato que foi verificado."
        value: ${{ jobs.verificar.outputs.sha }}
      assunto:
        description: "Assunto do commit verificado."
        value: ${{ jobs.verificar.outputs.assunto }}

permissions:
  contents: read

jobs:
  verificar:
    name: Gate de qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 25

    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      assunto: ${{ steps.commit.outputs.assunto }}

    env:
      # email-modelos.ts formata datas com toLocaleDateString("pt-BR") sem
      # timezone fixa — sem isto, os testes de validade flakeariam entre a
      # máquina local (America/Sao_Paulo) e o runner em UTC.
      TZ: America/Sao_Paulo
      # RESEND_API_KEY fica deliberadamente FORA deste workflow: a ausência da
      # key é o único kill switch do envio real de e-mail, e o setup dos testes
      # de integração aborta se ela existir. Não adicione como secret aqui.
      #
      # NEXT_PUBLIC_VAPID_PUBLIC_KEY e VAPID_PRIVATE_KEY, idem: a ausência é o
      # kill switch do Web Push. O setup de integração e o globalSetup do E2E
      # abortam se qualquer uma existir, e o smoke de PWA prova justamente que a
      # UI de push some sem elas. Não adicione como secret aqui.

    # Postgres efêmero para migrations, integração, seed e E2E. Mesma imagem e
    # credenciais do docker-compose.yml local — o que roda aqui é o que você
    # roda na sua máquina. A porta é 5432 porque no runner não há o conflito
    # que levou o local para a 5433.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: futzenha
          POSTGRES_PASSWORD: futzenha
          POSTGRES_DB: futzenha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U futzenha -d futzenha"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Vazio usa a ref do evento (PR/push); o deploy passa "main" para
          # garantir que só a main é publicada, de qualquer dropdown.
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Registrar o commit verificado
        id: commit
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "assunto=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"

      - name: Node (via .nvmrc) + cache do npm
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Guard-rail que faltou aqui uma vez. O lock chegou na main com uma aresta
      # peerOptional inválida (vite pedia esbuild ^0.27||^0.28 e enxergava a
      # 0.25.12 da raiz): o npm 11 tolerava, o npm 10 do runner tentava consertar
      # criando 27 posições que o lock não tinha, e o `npm ci` morria com
      # "Missing: esbuild@0.28.1" — mensagem que omite o CAMINHO e por isso
      # parecia mentira. `npm ls` acusa a aresta inválida em qualquer versão.
      - name: Lock íntegro (nenhuma aresta inválida)
        run: npm ls --all > /dev/null

      # --- Gate 1/8 -----------------------------------------------------------
      # Schema editado sem gerar migration: o drizzle-kit não gera nada quando
      # schema e drizzle/ batem; qualquer arquivo novo ou alterado é migration
      # esquecida. O `git add -N` põe os arquivos NOVOS no radar do diff — sem
      # ele, uma migration recém-gerada seria untracked e o diff passaria limpo.
      - name: Migration esquecida (schema x drizzle/)
        env:
          DATABASE_URL: postgres://futzenha:futzenha@localhost:5432/futzenha
        run: |
          set -euo pipefail
          npm run db:generate
          git add -N drizzle/
          git diff --exit-code drizzle/

      # --- Gate 2/8 -----------------------------------------------------------
      # Só o projeto unit: rápido e sem banco — falha barata primeiro.
      - name: Testes de unidade (vitest)
        run: npm test

      # --- Gate 3/8 -----------------------------------------------------------
      - name: Lint (eslint)
        run: npm run lint

      # --- Gate 4/8 -----------------------------------------------------------
      # O script é `next typegen && tsc --noEmit`, não só o tsc: next-env.d.ts é
      # gitignored e importa .next/types/*, que só existe depois do typegen.
      - name: Typecheck
        run: npm run typecheck

      # --- Gate 5/8 -----------------------------------------------------------
      # Roda o MESMO script que o build da Vercel executa antes do next build.
      # Nenhuma var VERCEL/VERCEL_ENV está setada aqui, então os gates de
      # src/db/migrate.ts deixam passar e o script roda inteiro: migrations +
      # provisionarPlatformAdmins + materializarPlatformAdmins.
      #
      # SESSION_SECRET não é necessária: o migrate importa hashPassword
      # (node:crypto) e siteUrl (só env), nunca sessionSecret().
      #
      # A segunda passada prova idempotência — que é o cenário real, porque este
      # script roda em TODO build de produção, não só quando há migration nova.
      - name: Dry-run das migrations (Postgres limpo)
        env:
          DATABASE_URL: postgres://futzenha:futzenha@localhost:5432/futzenha
          PLATFORM_ADMIN_USERNAMES: ci-admin
        run: |
          set -euo pipefail
          echo "::group::1ª passada (banco vazio)"
          npm run db:migrate:prod
          echo "::endgroup::"
          echo "::group::2ª passada (idempotência)"
          npm run db:migrate:prod
          echo "::endgroup::"

      # --- Gate 6/8 -----------------------------------------------------------
      # Unit + integração com cobertura, contra um banco próprio (o global-setup
      # cria futzenha_test no service e aplica as migrations pelo runner do
      # drizzle — obrigatório por causa do ALTER TYPE ... ADD VALUE da 0012).
      - name: Integração + cobertura (vitest, banco real)
        env:
          TEST_DATABASE_URL: postgres://futzenha:futzenha@localhost:5432/futzenha_test
        run: npm run test:coverage

      - name: Cobertura no resumo
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            {
              echo "## Cobertura"
              echo ""
              node -e '
                const s = require("./coverage/coverage-summary.json").total;
                for (const k of ["lines", "statements", "functions", "branches"]) {
                  console.log(`- ${k}: ${s[k].pct}% (${s[k].covered}/${s[k].total})`);
                }
              '
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # --- Gate 7/8 -----------------------------------------------------------
      # O único passo que roda DEPOIS das migrations no build de produção — e por
      # isso o mais importante de gatear. `npm run build` é
      # `tsx src/db/migrate.ts && next build`: se o next build quebrar lá, o schema
      # já avançou e o código não vai ao ar. Pega erro de prerender, que o tsc não
      # vê. Roda `npx next build` direto, sem o migrate na frente: o banco do runner
      # já está migrado pelo gate 5/8.
      #
      # SESSION_SECRET aqui só para o caso de alguma rota tocar sessionSecret() no
      # prerender — é valor de CI, não sai daqui.
      - name: Build de verificação
        env:
          DATABASE_URL: postgres://futzenha:futzenha@localhost:5432/futzenha
          SESSION_SECRET: ci-secret-nao-usado-em-producao
        run: npx next build

      # --- Gate 8/8 -----------------------------------------------------------
      # As três etapas abaixo preparam e rodam o E2E de fumaça.
      #
      # A chave já foi o hash do package-lock inteiro, e aí bump de QUALQUER
      # dependência descartava 270 MB e rebaixava o Chromium sem o browser ter
      # mudado. Quem determina a revisão baixada é a versão do playwright-core.
      - name: Versão do Playwright (chave do cache)
        id: pw
        run: |
          echo "versao=$(node -p "require('./node_modules/playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache dos browsers do Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.versao }}

      # Isto já foi um `npx playwright install --with-deps chromium` só. O flag
      # juntava numa etapa duas coisas de risco muito diferente: baixar o
      # browser (local, com cache) e mexer no apt (mirror de terceiro).
      # Separadas, o gate só depende da primeira.
      #
      # O apt continua sendo tentado — é ele que cobre o dia em que a imagem do
      # runner parar de trazer alguma lib do Chromium —, mas best-effort e com
      # teto. Hoje ele não acrescenta nada: nos logs das verificações verdes as
      # 17 libs aparecem como "is already the newest version", e o que sobra são
      # 9 pacotes de fonte CJK/cirílico/tailandês que nenhum smoke usa (não há
      # comparação de screenshot na suíte). Não é motivo para segurar PR.
      #
      # O caso que motivou tudo isto, em 19/08/2026: o azure.archive.ubuntu.com
      # parou de responder, o apt caiu no archive.ubuntu.com e ficou 22 min sem
      # imprimir uma linha, comendo o timeout inteiro do job e derrubando o gate.
      #
      # O ::warning:: é o que impede isto de virar degradação silenciosa: se ele
      # passar a aparecer em todo run com o apt saudável, é problema de imagem.
      - name: Instalar o Chromium do Playwright
        timeout-minutes: 6
        run: |
          set -euo pipefail
          npx playwright install chromium

          # Faz o apt desistir sozinho, em vez de depender só do relógio de
          # fora. Sem isto, esperar o azure morrer consumia 62 s do teto de
          # 120 s (30 s no run das 15:40) e sobrava menos da metade para o
          # mirror que de fato responde: a gente cortava a tentativa boa por
          # causa do tempo gasto na ruim.
          printf '%s\n' \
            'Acquire::http::Timeout "15";' \
            'Acquire::https::Timeout "15";' \
            'Acquire::Retries "1";' \
            | sudo tee /etc/apt/apt.conf.d/99-timeout-ci > /dev/null

          # Com o apt desistindo em ~15 s por mirror, o caso ruim inteiro fecha
          # em ~1 min, e o teto de fora deixa de ser corte às cegas para virar
          # backstop de verdade.
          #
          # O código precisa ser capturado com `|| codigo=$?`: dentro de um
          # `if`, o $? seguinte é o status do próprio if, não o do comando.
          codigo=0
          timeout -k 15 180 npx playwright install-deps chromium || codigo=$?
          if [ "$codigo" -eq 0 ]; then
            exit 0
          fi
          # 124/137 = cortado por não responder, ou seja, rede. Qualquer outro
          # código é o apt tendo respondido e recusado, ou seja, imagem. A
          # distinção poupa a próxima investigação.
          if [ "$codigo" -eq 124 ] || [ "$codigo" -eq 137 ]; then
            echo "::warning::apt travou sem responder (exit $codigo); seguindo sem as fontes extras"
          else
            echo "::warning::apt falhou (exit $codigo); seguindo sem as fontes extras"
          fi

      # E2E de fumaça contra o build de verdade, num banco só dele: o
      # e2e/global-setup.ts cria futzenha_e2e, migra e semeia sozinho. Não há
      # passo de seed aqui porque o seed é destrutivo, e o banco futzenha deste
      # runner é o mesmo que os gates 5/8 e 7/8 acabaram de usar.
      #
      # Sem DATABASE_URL de propósito: quem aponta o `next start` para o banco
      # certo é o `webServer.env` do playwright.config.ts. Declarar uma aqui
      # mascararia a falha — o servidor subiria contra o banco errado e os
      # specs quebrariam sem dizer por quê, em vez de o src/db/index.ts gritar
      # "DATABASE_URL não definida".
      #
      # Teto próprio porque o normal é cerca de 1 min (67 testes, 1 worker) e o
      # webServer.timeout do playwright.config.ts é 120 s. Cobre o caso de o
      # `next start` não subir — sem isto, isso consumiria os 25 min do job.
      - name: E2E (Playwright)
        timeout-minutes: 10
        env:
          # Porta 5432 (o runner não tem o conflito que levou o local para a
          # 5433) e sufixo _e2e, que o resolverUrlDeE2E exige — mesma dupla de
          # travas do TEST_DATABASE_URL acima.
          E2E_DATABASE_URL: postgres://futzenha:futzenha@localhost:5432/futzenha_e2e
          SESSION_SECRET: ci-secret-nao-usado-em-producao
          CI: "true"
        run: npm run e2e

      - name: Relatório do Playwright (só em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Informativo por enquanto: aponta CVE alto sem quebrar o gate. Vira
      # bloqueante quando a rotina de triagem existir.
      - name: npm audit (informativo)
        continue-on-error: true
        run: npm audit --audit-level=high

      # Os valores entram por `env:`, nunca como `${{ }}` no meio do script: a
      # interpolação acontece ANTES do bash, então um assunto de commit contendo
      # `cmd` ou $(cmd) viraria código executado aqui. Expandir $ASSUNTO é seguro —
      # o bash não reinterpreta o conteúdo de uma variável. Vale para toda etapa
      # nova que imprima dado vindo do repositório.
      - name: Resumo da verificação
        if: always()
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          ASSUNTO: ${{ steps.commit.outputs.assunto }}
        run: |
          {
            echo "## Verificação"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`$SHA\` |"
            echo "| assunto | $ASSUNTO |"
            echo ""
            echo "Verificado: migration esquecida · vitest unit · eslint · typecheck · migrations em Postgres limpo (2x) · integração + cobertura · next build · E2E Playwright · npm audit (informativo)."
          } >> "$GITHUB_STEP_SUMMARY"
