name: Deploy (produção)

# Único gatilho: o botão "Run workflow" na aba Actions. O deploy automático da
# Vercel está desligado (vercel.json → git.deploymentEnabled), então este é o
# único caminho para publicar.
#
# ATENÇÃO ao dropdown de branch: ele escolhe de qual ref o GitHub lê ESTE
# ARQUIVO. O código publicado é sempre o da main, garantido pelo `ref: main` do
# checkout — mas para testar mudanças no próprio workflow, dispare da branch
# onde você as fez.
on:
  workflow_dispatch:

# Dois deploys ao mesmo tempo aplicariam migrations concorrentes no mesmo banco.
# cancel-in-progress: false — nunca abortar um deploy no meio; o segundo espera.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

permissions:
  contents: read
  # Para consultar os check-runs do commit da main (job `checar`).
  checks: read

jobs:
  # ---------------------------------------------------------------------------
  # 1) CHECAR — a main já está verde?
  #
  # Todo push na main roda a mesma verificação deste gate (ci.yml). Se o commit
  # a publicar já tem aquele check verde, re-rodar tudo aqui só repetiria ~25
  # minutos de trabalho idêntico. Este job congela o SHA da main uma única vez
  # e pergunta à API se ele já passou; o gate abaixo só roda como fallback.
  # ---------------------------------------------------------------------------
  checar:
    name: Checar se a main já está verde
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.checar.outputs.sha }}
      verde: ${{ steps.checar.outputs.verde }}
    steps:
      # O checkout resolve "main" para um SHA concreto. Daqui em diante todo o
      # workflow (consulta, gate, checkout do deploy) usa ESTE SHA — a main
      # pode avançar no meio do caminho sem trocar o que vai ao ar.
      - name: Checkout da main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      # O filtro é por sufixo porque o check do reusable aparece com nome
      # composto — "Verificação / Gate de qualidade" (ver ci.yml). Qualquer
      # estado que não seja sucesso concluído (em andamento, falho, check
      # inexistente) cai no fallback: o gate roda aqui mesmo, como sempre rodou.
      - name: Consultar check-runs do commit
        id: checar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          sucessos=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs" \
            --paginate \
            --jq '[.check_runs[] | select((.name | endswith("Gate de qualidade")) and .conclusion == "success")] | length')
          if [ "$sucessos" -gt 0 ]; then verde=true; else verde=false; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "verde=$verde" >> "$GITHUB_OUTPUT"
          {
            echo "## Gate de qualidade"
            echo ""
            if [ "$verde" = "true" ]; then
              echo "**Pulado:** o commit \`$sha\` já passou pela verificação no CI da main."
            else
              echo "**Vai rodar:** nenhum check \"Gate de qualidade\" verde para o commit \`$sha\` (CI ainda em andamento, falho ou inexistente)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 2) GATE — tudo que precisa estar verde antes de publicar.
  #
  # A verificação em si mora em verificacao.yml (a mesma que roda em todo PR e
  # todo push na main pelo ci.yml): uma única fonte de verdade do que "verde"
  # significa. Só roda quando o `checar` não encontrou o check verde — no fluxo
  # normal (merge → CI da main verde → deploy) ele é pulado.
  # ---------------------------------------------------------------------------
  gate:
    name: Gate de qualidade
    needs: checar
    if: needs.checar.outputs.verde != 'true'
    uses: ./.github/workflows/verificacao.yml
    with:
      ref: ${{ needs.checar.outputs.sha }}

  # ---------------------------------------------------------------------------
  # 3) DEPLOY — só roda se o gate passou OU foi pulado por já estar verde.
  #
  # O `!cancelled()` é obrigatório: sem ele, o gate pulado (skipped) pularia
  # este job também, e o caminho rápido nunca publicaria nada.
  # ---------------------------------------------------------------------------
  deploy:
    name: Publicar na Vercel
    needs: [checar, gate]
    if: >-
      !cancelled() &&
      needs.checar.result == 'success' &&
      (needs.gate.result == 'success' ||
       (needs.gate.result == 'skipped' && needs.checar.outputs.verde == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Faz o link aparecer na aba "Deployments" do repositório. Para exigir
    # aprovação manual antes de publicar:
    # Settings → Environments → Production → Required reviewers.
    #
    # O nome tem que bater EXATAMENTE com o ambiente onde os secrets foram
    # cadastrados: secret de ambiente só é injetado no job que declara aquele
    # ambiente. Já custou um deploy — o job pedia "producao" (ambiente que o
    # GitHub criou sozinho, vazio) enquanto os secrets estavam em "Production",
    # e as três variáveis chegaram vazias em vez de "***".
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.url }}

    env:
      # Substituem o diretório .vercel/ — a CLI usa estes valores como o link do
      # projeto. É por isso que NÃO rodamos `vercel pull`, que baixaria a
      # DATABASE_URL de produção para o disco do runner.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # A CLI lê o token daqui sozinha. Como env e não como `--token=` na linha de
      # comando: flag vira argv, que qualquer processo do runner consegue ler.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout do commit aprovado
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.checar.outputs.sha }}
          fetch-depth: 1

      - name: Node (via .nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      # Versão pinada, e não `@latest`: este job carrega o VERCEL_TOKEN, então
      # instalar a versão do dia é confiar em quem publicar o pacote entre um
      # deploy e o seguinte. Subir a versão passa a ser decisão, com diff.
      - name: Instalar a CLI da Vercel
        run: npm i -g vercel@59.1.4

      # SEM --prebuilt de propósito: o build (e portanto
      # `tsx src/db/migrate.ts && next build`) roda na infra da Vercel, com as
      # env vars dela. A connection string do Neon nunca chega ao GitHub.
      #
      # O upload respeita o .gitignore, então .env e node_modules/ ficam de fora.
      # `vercel deploy` espera o build terminar e sai com código != 0 se ele
      # falhar — inclusive se uma migration quebrar.
      - name: Deploy de produção
        id: deploy
        env:
          SHA: ${{ needs.checar.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          url=$(vercel deploy --prod --yes \
            --meta githubSha="$SHA" \
            --meta githubRunId="$RUN_ID")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployment: $url"

      # Mesma regra do resumo do gate: valor por `env:`, nunca `${{ }}` solto no
      # script. Aqui o `if` compara $OUTCOME, não a interpolação.
      - name: Resumo do deploy
        if: always()
        env:
          SHA: ${{ needs.checar.outputs.sha }}
          OUTCOME: ${{ steps.deploy.outcome }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "## Deploy de produção"
            echo ""
            if [ "$OUTCOME" = "success" ]; then
              echo "**Publicado:** <https://futzenha.com.br>"
              echo ""
              echo "Deployment desta build: $URL"
            else
              echo "Deploy falhou. Veja o log do build no painel da Vercel."
            fi
            echo ""
            echo "Commit: \`$SHA\`"
            echo ""
            echo "> O link de convite do admin da plataforma, quando existe, sai no **log do build da Vercel** — não aqui."
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------------
      # GANCHO: pós-deploy (smoke test, notificação, tag git). Ex.:
      #   - name: Smoke test
      #     run: curl -fsS https://futzenha.com.br/login > /dev/null
      # ------------------------------------------------------------------------
