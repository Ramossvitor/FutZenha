name: Deploy (produção)

# Único gatilho: o botão "Run workflow" na aba Actions. O deploy automático da
# Vercel está desligado (vercel.json → git.deploymentEnabled), então este é o
# único caminho para publicar.
#
# ATENÇÃO ao dropdown de branch: ele escolhe de qual ref o GitHub lê ESTE
# ARQUIVO. O código publicado é sempre o da main, garantido pelo `ref: main` do
# checkout — mas para testar mudanças no próprio workflow, dispare da branch
# onde você as fez.
on:
  workflow_dispatch:

# Dois deploys ao mesmo tempo aplicariam migrations concorrentes no mesmo banco.
# cancel-in-progress: false — nunca abortar um deploy no meio; o segundo espera.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1) GATE — tudo que precisa estar verde antes de publicar.
  #
  # A verificação em si mora em verificacao.yml (a mesma que roda em todo PR
  # pelo ci.yml): uma única fonte de verdade do que "verde" significa. O
  # `ref: main` é o que garante "sempre a main", de qualquer dropdown.
  # ---------------------------------------------------------------------------
  gate:
    name: Gate de qualidade
    uses: ./.github/workflows/verificacao.yml
    with:
      ref: main

  # ---------------------------------------------------------------------------
  # 2) DEPLOY — só roda se o gate inteiro passou.
  # ---------------------------------------------------------------------------
  deploy:
    name: Publicar na Vercel
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Faz o link aparecer na aba "Deployments" do repositório. Para exigir
    # aprovação manual antes de publicar:
    # Settings → Environments → Production → Required reviewers.
    #
    # O nome tem que bater EXATAMENTE com o ambiente onde os secrets foram
    # cadastrados: secret de ambiente só é injetado no job que declara aquele
    # ambiente. Já custou um deploy — o job pedia "producao" (ambiente que o
    # GitHub criou sozinho, vazio) enquanto os secrets estavam em "Production",
    # e as três variáveis chegaram vazias em vez de "***".
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.url }}

    env:
      # Substituem o diretório .vercel/ — a CLI usa estes valores como o link do
      # projeto. É por isso que NÃO rodamos `vercel pull`, que baixaria a
      # DATABASE_URL de produção para o disco do runner.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # A CLI lê o token daqui sozinha. Como env e não como `--token=` na linha de
      # comando: flag vira argv, que qualquer processo do runner consegue ler.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout do commit aprovado no gate
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 1

      - name: Node (via .nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Instalar a CLI da Vercel
        run: npm i -g vercel@latest

      # SEM --prebuilt de propósito: o build (e portanto
      # `tsx src/db/migrate.ts && next build`) roda na infra da Vercel, com as
      # env vars dela. A connection string do Neon nunca chega ao GitHub.
      #
      # O upload respeita o .gitignore, então .env e node_modules/ ficam de fora.
      # `vercel deploy` espera o build terminar e sai com código != 0 se ele
      # falhar — inclusive se uma migration quebrar.
      - name: Deploy de produção
        id: deploy
        env:
          SHA: ${{ needs.gate.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          url=$(vercel deploy --prod --yes \
            --meta githubSha="$SHA" \
            --meta githubRunId="$RUN_ID")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployment: $url"

      # Mesma regra do resumo do gate: valor por `env:`, nunca `${{ }}` solto no
      # script. Aqui o `if` compara $OUTCOME, não a interpolação.
      - name: Resumo do deploy
        if: always()
        env:
          SHA: ${{ needs.gate.outputs.sha }}
          OUTCOME: ${{ steps.deploy.outcome }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "## Deploy de produção"
            echo ""
            if [ "$OUTCOME" = "success" ]; then
              echo "**Publicado:** <https://futzenha.com.br>"
              echo ""
              echo "Deployment desta build: $URL"
            else
              echo "Deploy falhou. Veja o log do build no painel da Vercel."
            fi
            echo ""
            echo "Commit: \`$SHA\`"
            echo ""
            echo "> O link de convite do admin da plataforma, quando existe, sai no **log do build da Vercel** — não aqui."
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------------
      # GANCHO: pós-deploy (smoke test, notificação, tag git). Ex.:
      #   - name: Smoke test
      #     run: curl -fsS https://futzenha.com.br/login > /dev/null
      # ------------------------------------------------------------------------
